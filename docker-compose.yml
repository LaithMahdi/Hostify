version: "3.8"

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hostify
      - NODE_ENV=development
    depends_on:
      - db
    command: bun run dev

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hostify
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prisma-studio:
    build:
      context: .
      target: development
    ports:
      - "8881:8881"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hostify
    depends_on:
      - db
    command: bun run studio

volumes:
  postgres_data:
